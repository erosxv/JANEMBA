# Gera os apps do CallZinha (Windows, Linux e Android) nos servidores do GitHub.
# Roda quando você manda uma tag tipo v1.2.0, ou na mão em Actions → "Gerar apps" → Run workflow.
# Os arquivos ficam em Actions → a execução → Artifacts (e numa Release, se veio de uma tag).
name: Gerar apps

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Antes de gerar qualquer app: duas pessoas entram numa sala de teste (Chrome com microfone falso) e o
  # script confere versão, conexão, áudio, filtros de ruído e erros. Se falhar, nenhum app é gerado.
  teste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/teste-chamada.js

  desktop:
    needs: teste
    strategy:
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            files: |
              dist/*.exe
              dist/*.exe.blockmap
              dist/latest.yml
          - os: ubuntu-latest
            script: dist:linux
            files: |
              dist/*.AppImage
              dist/*.deb
              dist/*.tar.gz
              dist/latest-linux.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run ${{ matrix.script }} -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: callzinha-${{ matrix.os }}
          path: ${{ matrix.files }}
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: '${{ matrix.files }}' }

  android:
    needs: teste
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run build:web && npx cap sync android
      # Chave de assinatura fixa: o .jks em base64 e a senha ficam nos segredos do repositório.
      # Sem eles o APK sairia com outra assinatura e não instalaria por cima do app antigo, então o build para.
      - name: Chave de assinatura
        env: { KS: '${{ secrets.ANDROID_KEYSTORE }}' }
        run: |
          if [ -z "$KS" ]; then echo "::error title=Assinatura::Falta o segredo ANDROID_KEYSTORE no GitHub"; exit 1; fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/callzinha.jks"
          echo "CZ_KEYSTORE=$RUNNER_TEMP/callzinha.jks" >> "$GITHUB_ENV"
      # Se o Gradle falhar, o trecho "What went wrong" vira uma anotação (dá pra ler sem login no GitHub)
      - name: Gerar APK
        env: { CZ_KEYSTORE_PASS: '${{ secrets.ANDROID_KEYSTORE_PASSWORD }}' }
        run: |
          chmod +x android/gradlew
          cd android
          set +e
          ./gradlew assembleRelease --stacktrace 2>&1 | tee ../gradle.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            msg=$(grep -A30 "What went wrong" ../gradle.log | head -45)
            [ -z "$msg" ] && msg=$(tail -45 ../gradle.log)
            msg="${msg//'%'/'%25'}"; msg="${msg//$'\r'/'%0D'}"; msg="${msg//$'\n'/'%0A'}"
            echo "::error title=Gradle::$msg"
          fi
          exit $status
      - run: mv android/app/build/outputs/apk/release/app-release.apk CallZinha.apk
      - uses: actions/upload-artifact@v4
        with: { name: callzinha-android, path: CallZinha.apk }
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: CallZinha.apk }
